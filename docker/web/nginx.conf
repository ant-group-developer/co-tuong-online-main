# Cache theo loại file: assets có hash → cache lâu; env-config.js → không cache; còn lại → kiểm tra lại mỗi lần.
map $uri $xq_cache {
  ~^/assets/        "public, max-age=31536000, immutable";
  /env-config.js    "no-store";
  default           "no-cache";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  charset_types text/css application/javascript application/json image/svg+xml;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  add_header Cache-Control $xq_cache always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://apis.google.com https://*.firebaseio.com https://*.firebasedatabase.app https://www.gstatic.com https://www.google.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebasedatabase.app https://*.cloudfunctions.net https://*.run.app https://content-firebaseappcheck.googleapis.com https://www.google.com; img-src 'self' data: https://*.googleusercontent.com; style-src 'self' 'unsafe-inline'; frame-src https://*.firebaseapp.com https://*.web.app https://www.google.com https://apis.google.com; worker-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors *" always;

  # SPA: đường dẫn không phải file → index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
