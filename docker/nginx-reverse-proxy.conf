# Mẫu reverse proxy cho nginx trên server (aaPanel: Website → co-tuong.antfootage.net → Reverse proxy,
# hoặc dán vào file cấu hình site). Domain (port 80/443) → container web ở 127.0.0.1:11426.
location / {
    proxy_pass http://127.0.0.1:11426;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
